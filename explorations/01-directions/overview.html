<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Howl · Round 01 overview</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; background: #f4f4f2; color: #1a1a1a; font: 400 16px/1.5 system-ui, sans-serif; }
      h1 { margin: 0 0 32px; font-size: 24px; }
      .row { display: flex; gap: 32px; align-items: flex-start; overflow-x: auto; padding-bottom: 32px; }
      figure { flex: none; width: 390px; margin: 0; }
      h2 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 16px; min-height: 72px; }
      iframe { display: block; width: 390px; height: 760px; border: 1px solid #c9c9c4; border-radius: 24px; background: #fff; margin-bottom: 16px; }
      a { color: inherit; text-underline-offset: 4px; }
      a:focus-visible { outline: 3px solid #1a1a1a; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <h1>Howl, round 01</h1>
    <div class="row">
      <figure>
        <h2>A · Loud</h2>
        <p>A giant red wordmark over a quiet, warm-white feed, with campus places as tappable circles and a pill Howl button on every post.</p>
        <iframe src="a-loud.html" title="Direction A, Loud"></iframe>
        <a href="a-loud.html">Open full page</a>
      </figure>
      <figure>
        <h2>B · Late shift</h2>
        <p>A dense, true-black feed where gray does the talking and amber lights up only what was posted in the last few hours.</p>
        <iframe src="b-late-shift.html" title="Direction B, Late shift"></iframe>
        <a href="b-late-shift.html">Open full page</a>
      </figure>
      <figure>
        <h2>C · Howl bar</h2>
        <p>White cards on deep navy, each ending in a full-width coral bar that makes Howling the quickest thing to tap.</p>
        <iframe src="c-howl-bar.html" title="Direction C, Howl bar"></iframe>
        <a href="c-howl-bar.html">Open full page</a>
      </figure>
    </div>
  </body>
</html>
